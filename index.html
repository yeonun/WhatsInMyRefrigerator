<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 냉장고</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<link rel="stylesheet" href="css/style.css?v=20260924c">
</head>
<body>

  <!-- 초기 로딩 (자동로그인 판별 전, 화면 깜빡임 방지용) -->
  <div id="loading-screen" class="screen">
    <div class="pixel-spinner">
      <span></span><span></span><span></span><span></span>
    </div>
    <p class="loading-text">불러오는 중...</p>
  </div>

  <!-- 로그인 전 화면 -->
  <div id="login-screen" class="screen hidden">
    <div class="login-bg">
      <img src="img/fridge-kitchen.png" alt="하얀 4도어 냉장고가 있는 아늑한 주방" class="login-bg-img">
      <div class="login-scrim"></div>
    </div>

    <div class="login-overlay">
      <div class="speech-bubble">냉장고 속을 보려면<br>로그인이 필요해요 !</div>

      <button id="google-login-btn" class="btn btn-pixel btn-google">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6 29.5 4 24 4c-7.7 0-14.3 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.2-2 13.9-5.3l-6.4-5.4c-2.1 1.5-4.7 2.4-7.5 2.4-5.4 0-9.9-3.4-11.5-8.2l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.3 4.5-4.2 6l6.4 5.4C41.5 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Google로 로그인
      </button>
      <p id="login-error" class="login-error hidden"></p>
    </div>
  </div>

  <!-- 로그인 후 메인 화면 -->
  <div id="app-screen" class="screen hidden">
    <header class="topbar">
      <div class="topbar-title">
        <span class="topbar-emoji">🧊</span>
        <h1>우리집 냉장고</h1>
      </div>
      <div class="topbar-user">
        <img id="user-photo" class="user-photo" alt="">
        <span id="user-name"></span>
        <button id="logout-btn" class="btn btn-ghost">로그아웃</button>
      </div>
    </header>

    <main class="content">
      <!-- 냉장고 탭: 문을 열어서 안을 들여다보는 경험 -->
      <section id="tab-fridge" class="tab-panel">
        <div class="fridge-photo-wrap">
          <div class="fridge-stage">
            <div id="fridge-photo" class="fridge-photo-bg"></div>
            <div id="sticky-notes" class="sticky-notes"></div>
            <button id="fridge-zone-top" class="fridge-zone fridge-zone-top" aria-label="냉장실 칸 열기"></button>
            <button id="fridge-zone-freezer-left" class="fridge-zone fridge-zone-freezer-left" aria-label="냉동실(좌) 열기"></button>
            <button id="fridge-zone-freezer-right" class="fridge-zone fridge-zone-freezer-right" aria-label="냉동실(우) 열기"></button>
          </div>
          <p class="fridge-caption">👆 냉장고 문을 탭해서 열어보세요</p>
        </div>
      </section>

      <!-- 전체보기 탭: 검색/필터로 한눈에 정리 -->
      <section id="tab-list" class="tab-panel hidden">
        <section class="summary-bar">
          <div class="summary-chip total"><span id="count-total">0</span><label>전체</label></div>
          <div class="summary-chip warn"><span id="count-soon">0</span><label>유통기한 임박</label></div>
          <div class="summary-chip danger"><span id="count-expired">0</span><label>유통기한 지남</label></div>
        </section>

        <section class="controls">
          <input id="search-input" class="search-input" type="text" placeholder="🔍 재료 이름 검색">
          <div class="filter-row">
            <select id="filter-category" class="select-input">
              <option value="">전체 카테고리</option>
            </select>
            <select id="filter-location" class="select-input">
              <option value="">전체 위치</option>
            </select>
            <select id="sort-select" class="select-input">
              <option value="expiry">유통기한 빠른순</option>
              <option value="name">이름순</option>
              <option value="createdAt">최근 추가순</option>
            </select>
          </div>
        </section>

        <section id="item-list" class="item-list">
          <!-- items rendered here -->
        </section>

        <p id="empty-state" class="empty-state hidden">아직 등록된 재료가 없어요. 오른쪽 아래 + 버튼으로 추가해보세요!</p>
      </section>
    </main>

    <button id="add-item-fab" class="fab" title="재료 추가">+</button>

    <nav class="tabbar">
      <button class="tab-btn active" data-tab="fridge"><span class="tab-icon">🧊</span>냉장고</button>
      <button class="tab-btn" data-tab="list"><span class="tab-icon">📋</span>전체보기</button>
    </nav>
  </div>

  <!-- 냉장고 칸 팝업 -->
  <div id="fridge-shelf-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="fridge-shelf-title">냉장실</h2>
        <button id="fridge-shelf-close-btn" class="btn btn-ghost">✕</button>
      </div>
      <div id="fridge-shelf-list" class="item-list"></div>
      <p id="fridge-shelf-empty" class="empty-state hidden">이 칸은 비어있어요</p>
    </div>
  </div>

  <!-- 재료 추가/수정 모달 -->
  <div id="item-modal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">재료 추가</h2>
        <button id="modal-close-btn" class="btn btn-ghost">✕</button>
      </div>
      <form id="item-form" class="modal-form">
        <input type="hidden" id="item-id">

        <label class="form-label">재료 이름 *</label>
        <input id="item-name" class="form-input" type="text" required placeholder="예: 계란, 우유, 삼겹살">

        <div class="form-row">
          <div class="form-col">
            <label class="form-label">수량</label>
            <input id="item-quantity" class="form-input" type="text" placeholder="예: 1팩, 500g, 2개">
          </div>
          <div class="form-col">
            <label class="form-label">유통기한</label>
            <input id="item-expiry" class="form-input" type="date">
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <label class="form-label">카테고리</label>
            <select id="item-category" class="form-input"></select>
          </div>
          <div class="form-col">
            <label class="form-label">보관 위치</label>
            <select id="item-location" class="form-input"></select>
          </div>
        </div>

        <label class="form-label">메모</label>
        <textarea id="item-memo" class="form-input" rows="2" placeholder="선택 입력"></textarea>

        <div class="modal-actions">
          <button type="button" id="delete-item-btn" class="btn btn-danger hidden">삭제</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Firebase SDK (compat 버전: 별도 빌드 도구 없이 CDN으로 바로 사용) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js?v=20260924c"></script>
  <script src="js/app.js?v=20260924c"></script>
</body>
</html>
